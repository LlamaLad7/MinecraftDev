<body>
<p>
    Reports local variable declarations that can be removed and their initializers inlined.
</p>
<p>
    Removing unnecessary local variables helps simplify the code and clarifies its intent.
</p>
<p>Example:</p>
<pre><code>
String s = "foo";
return s;
</code></pre>
<p>After the fix:</p>
<pre><code>
return "foo";
</code></pre>
